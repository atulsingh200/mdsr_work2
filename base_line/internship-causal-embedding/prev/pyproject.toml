[project]
name = "follow-up-causal-embeddings"
version = "0.1.0"
description = "Datasets and middleware for follow-up causal embedding research"
readme = "README.md"
authors = [{ name = "nikpuri", email = "nikpuri@adobe.com" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tqdm>=4.66",
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "rich>=13.7",
    "typer>=0.12",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hard-negatives = ["rank-bm25>=0.2.2"]
embeddings = ["sentence-transformers>=3.0", "numpy>=1.26"]
training = ["torch>=2.0", "transformers>=4.40", "numpy>=1.26"]
evaluation = ["torch>=2.0", "transformers>=4.40", "numpy>=1.26", "scikit-learn>=1.3"]
llm-baseline = ["requests>=2.32", "botocore>=1.34"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
followup-data = "followup_data.cli:app"
train-biencoder = "biencoder.training.train:main"
evaluate-retrieval = "evaluation.retrieval_eval:main"
evaluate-llm-baseline = "evaluation.llm_baseline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/followup_data", "src/biencoder", "src/evaluation"]
