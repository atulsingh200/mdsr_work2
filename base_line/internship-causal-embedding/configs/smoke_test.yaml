# Quick smoke test — 100 queries, random negatives only.
# Used to verify the pipeline runs end-to-end without errors.
# Run with:
#   uv run python scripts/run_eval.py --config configs/smoke_test.yaml

models:
  - type: pretrained
    hf_id: BAAI/bge-small-en-v1.5
  - type: tfidf

datasets:
  - aep_causal

splits:
  - test

negatives:
  - random

eval:
  pool_size: 100
  k_negatives: 4
  seed: 42
  k_values: [1, 5, 10]
  max_queries: 100

output:
  dir: results/smoke_test
