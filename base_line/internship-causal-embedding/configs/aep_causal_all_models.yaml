# Evaluate all trained models on aep_causal with all negative strategies.
# Run with:
#   uv run python scripts/run_eval.py --config configs/aep_causal_all_models.yaml

models:
  - type: cross_encoder_2x
    checkpoint: my_work/kl/cross_encoder_2x/results/aep_causal/checkpoint_best.pt
  - type: biencoder
    checkpoint: finetune_eval/results/aep_causal/checkpoint_best.pt
  - type: cde
    checkpoint: my_work/kl/results/aep_causal/cde_best.pt
  - type: pretrained
    hf_id: BAAI/bge-small-en-v1.5

datasets:
  - aep_causal

splits:
  - test

negatives:
  - random
  - bm25

eval:
  pool_size: 1000
  k_negatives: 4
  seed: 42
  k_values: [1, 3, 5, 10]
  max_queries: 0

output:
  dir: results/aep_causal_all_models
