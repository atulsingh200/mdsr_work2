model_name: "gpt2"           # "gpt2-medium" for 355M
max_len: 1024

# training
batch_size: 16
grad_accum_steps: 4          # effective batch = 64
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.06
num_epochs: 3
max_grad_norm: 1.0
fp16: true

# data
train_path: "../data/aep_causal_classification_34/directional_train.jsonl"
val_path:   "../data/aep_causal_classification_34/directional_val.jsonl"
test_path:  "../data/aep_causal_classification_34/directional_test.jsonl"

# output
output_dir: "./checkpoints"
log_every:  100              # steps
